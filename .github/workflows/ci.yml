name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly: catch breakage from newly released dependencies

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }}, ${{ matrix.resolution }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
        resolution: [highest]
        include:
          # the lowest dependency versions the package declares must also work
          - os: ubuntu-latest
            python: "3.12"
            resolution: lowest-direct
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --resolution ${{ matrix.resolution }}
      - name: Lint
        run: uv run ruff check src tests examples
      - name: Tests
        run: uv run pytest -q

  wheel:
    name: build and test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: uv build
      - name: Quickstart from the built wheel (not the working tree)
        shell: bash
        run: |
          uv venv /tmp/wheel-env
          uv pip install --python /tmp/wheel-env dist/*.whl
          export PATH=/tmp/wheel-env/bin:$PATH
          cd "$(mktemp -d)"
          verdict-gate --version
          verdict-gate example --out demo && cd demo
          verdict-gate validate results.csv
          verdict-gate calibrate results.csv --revision parent --out floor.yaml
          verdict-gate import results.csv --revision parent --max-tokens 256 --out parent.json
          verdict-gate import results.csv --revision cand-1 --parent-id parent --revision-file candidate_skill.md \
            --max-tokens 256 --out candidate.json
          set +e
          verdict-gate compare --baseline parent.json --candidate candidate.json --policy moderate \
            --fnoise floor.yaml --out card.json
          code=$?
          set -e
          test "$code" -eq 30   # the documented decision: UNSUPPORTED
          verdict-gate validate card.json
          verdict-gate card render card.json > card.md
      - name: Wheel contains only the package
        run: |
          python -m zipfile -l dist/*.whl | awk '{print $1}' | grep -v -E '^(verdict_gate/|verdict_gate-.*\.dist-info/|File)' && exit 1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
